name: Build MuzikCepte APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Build APK and AAB Bundle (Release)
      run: gradle assembleRelease bundleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MuzikCepte-APK
        path: app/build/outputs/apk/release/app-release.apk

    - name: Upload AAB Bundle Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MuzikCepte-AAB
        path: app/build/outputs/bundle/release/app-release.aab

    - name: Send APK to Telegram
      run: |
        curl -v -F chat_id="1138542567" \
             -F caption="🔥 <b>MüzikCepte v1.8.6 (v39) - Gerçek Çevrimdışı (İnternetsiz) Oynatma & Kesintisiz Radyo Motoru</b>%0A%0A📶 <b>GERÇEK ÇEVRİMDİŞİ (SIFIR İNTERNET):</b> [📶 Kaydet] butonuna bastığınızda şarkı doğrudan telefonun dahili hafızasına kaydedilir. İnternet kapalıyken bile anında yerel dosyadan sıfır internetle çalar.%0A📻 <b>RADYO AKICI ÇALMA:</b> Shoutcast ICY metadata ayrıştırıcı hatası giderildi, canlı radyolar artık sıfır takılma ve pürüzsüz akışla çalıyor.%0A⚡ <b>RAPIDAPI SAF MP3:</b> Online şarkılar donanımsal C++ MediaPlayer ile akmaya devam ediyor.%0A📥 <b>MP3 İNDİRME:</b> İndirilenler klasörüne gerçek .mp3 olarak iniyor." \
             -F parse_mode="HTML" \
             -F document=@app/build/outputs/apk/release/app-release.apk \
             https://api.telegram.org/bot6997346023:AAGjQMOIso_j8ZGY5xDUpLip5_r2K0JTbYo/sendDocument

    - name: Send AAB to Telegram
      run: |
        curl -v -F chat_id="1138542567" \
             -F caption="📦 <b>MüzikCepte v1.8.6 (v39) Google Play AAB Paketi</b>%0A%0AGoogle Play Console Target SDK 36 resmi sürüm paketi." \
             -F parse_mode="HTML" \
             -F document=@app/build/outputs/bundle/release/app-release.aab \
             https://api.telegram.org/bot6997346023:AAGjQMOIso_j8ZGY5xDUpLip5_r2K0JTbYo/sendDocument
