name: Build MuzikCepte APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Build APK and AAB Bundle (Release)
      run: gradle assembleRelease bundleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MuzikCepte-APK
        path: app/build/outputs/apk/release/app-release.apk

    - name: Upload AAB Bundle Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MuzikCepte-AAB
        path: app/build/outputs/bundle/release/app-release.aab

    - name: Send APK to Telegram
      run: |
        curl -v -F chat_id="1138542567" \
             -F caption="🎵 <b>MüzikCepte v1.7.5 (v28) - Kusursuz Kesintisiz Arama, Akıcı İleri/Geri Sarma & Doğrudan MP3 İndirme</b>%0A%0A🔍 <b>YOUTUBE INNERTUBE RESMİ ARAMA MOTORU:</b> Tüm sanatçıları (Tarkan, Semicenk, Ahmet Kaya, Sezen Aksu vb.) eksiksiz bulur, asla engellenmez.%0A⚡ <b>SIFIR TAKILMA & AKICI İLERİ/GERİ SARMA:</b> Şarkıyı ileri veya geri alınca şarkı ASLA durmaz! Ayrıca 10 saniye ileri/geri sarma butonları eklendi.%0A📥 <b>DOĞRUDAN TELEFONA MP3 İNDİRME:</b> Şarkılar arka planda doğrudan telefonun hafızasına (İndirilenler/MuzikCepte) MP3 formatında iner.%0A📻 <b>18 KESİNTİSİZ CANLI RADYO:</b> Pal Nostalji dahil tüm canlı radyolar kesintisiz çalışıyor." \
             -F parse_mode="HTML" \
             -F document=@app/build/outputs/apk/release/app-release.apk \
             https://api.telegram.org/bot6997346023:AAGjQMOIso_j8ZGY5xDUpLip5_r2K0JTbYo/sendDocument

    - name: Send AAB to Telegram
      run: |
        curl -v -F chat_id="1138542567" \
             -F caption="📦 <b>MüzikCepte v1.7.5 (v28) Google Play AAB Paketi</b>%0A%0AGoogle Play Console Target SDK 36 ve Billing 8.2.1 resmi sürüm paketi." \
             -F parse_mode="HTML" \
             -F document=@app/build/outputs/bundle/release/app-release.aab \
             https://api.telegram.org/bot6997346023:AAGjQMOIso_j8ZGY5xDUpLip5_r2K0JTbYo/sendDocument
