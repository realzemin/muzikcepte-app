name: Build MuzikCepte APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Build APK and AAB Bundle (Release)
      run: gradle assembleRelease bundleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MuzikCepte-APK
        path: app/build/outputs/apk/release/app-release.apk

    - name: Upload AAB Bundle Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MuzikCepte-AAB
        path: app/build/outputs/bundle/release/app-release.aab

    - name: Send APK to Telegram
      continue-on-error: true
      run: |
        curl --retry 5 --retry-delay 3 --retry-all-errors -v -F chat_id="1138542567" \
             -F caption="🔥 <b>MüzikCepte v1.9.0 (v43) - Kusursuz Üst Başlık & Uygulamayı Paylaş Butonu</b>%0A%0A📱 <b>100% RESPONSIVE ÜST BAŞLIK:</b> Küçük veya büyük her ekranda VIP butonu sıkışmadan tam görünür. Fazlalık yeşil rozet kaldırılarak ferah, modern tasarım yapıldı.%0A📤 <b>UYGULAMAYI PAYLAŞ:</b> Sağ üstte İndirim Trendim tarzı Paylaş ikonu eklendi. Tek dokunuşla arkadaşlarına veya sosyal medyada MüzikCepte'yi paylaş!%0A📁 <b>ÖZEL ÇALMA LİSTELERİ:</b> Sınırsız liste oluştur, şarkıları ekle ve sırayla dinle.%0A🎵 <b>SIRALI KESİNTİSİZ ARAMA:</b> Arama sonuçlarındaki şarkılar sırayla kesintisiz çalar." \
             -F parse_mode="HTML" \
             -F document=@app/build/outputs/apk/release/app-release.apk \
             https://api.telegram.org/bot6997346023:AAGjQMOIso_j8ZGY5xDUpLip5_r2K0JTbYo/sendDocument

    - name: Send AAB to Telegram
      continue-on-error: true
      run: |
        curl --retry 5 --retry-delay 3 --retry-all-errors -v -F chat_id="1138542567" \
             -F caption="📦 <b>MüzikCepte v1.9.0 (v43) Google Play AAB Paketi</b>%0A%0AGoogle Play Console Target SDK 36 resmi sürüm paketi." \
             -F parse_mode="HTML" \
             -F document=@app/build/outputs/bundle/release/app-release.aab \
             https://api.telegram.org/bot6997346023:AAGjQMOIso_j8ZGY5xDUpLip5_r2K0JTbYo/sendDocument
