name: Build MuzikCepte APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Build APK and AAB Bundle (Release)
      run: gradle assembleRelease bundleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MuzikCepte-APK
        path: app/build/outputs/apk/release/app-release.apk

    - name: Upload AAB Bundle Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MuzikCepte-AAB
        path: app/build/outputs/bundle/release/app-release.aab

    - name: Send APK to Telegram
      continue-on-error: true
      run: |
        curl --retry 5 --retry-delay 3 --retry-all-errors -v -F chat_id="1138542567" \
             -F caption="🔥 <b>MüzikCepte v1.8.8 (v41) - Sıralı Arama Çalma & Özel Çalma Listeleri</b>%0A%0A🎵 <b>SIRALI KESİNTİSİZ ARAMA ÇALMA:</b> Arama yapıp şarkıya bastığınızda (örn. Tarkan), ileri/geri tuşlarına bastıkça sadece aradığınız sanatçının şarkıları sırayla çalar, başka sanatçıya atlamaz!%0A📁 <b>ÖZEL ÇALMA LİSTELERİ:</b> Kitaplığım sekmesinden dilediğiniz kadar yeni çalma listesi oluşturun, şarkıların yanındaki [➕ Liste] butonuyla listelerinize şarkı ekleyin!%0A🔍 <b>CANLI ARAMA & ÖNERİLER:</b> Harf harf YouTube Music önerileri.%0A📶 <b>GERÇEK ÇEVRİMDİŞİ:</b> [📶 Kaydet] ile internetsiz müzik keyfi." \
             -F parse_mode="HTML" \
             -F document=@app/build/outputs/apk/release/app-release.apk \
             https://api.telegram.org/bot6997346023:AAGjQMOIso_j8ZGY5xDUpLip5_r2K0JTbYo/sendDocument

    - name: Send AAB to Telegram
      continue-on-error: true
      run: |
        curl --retry 5 --retry-delay 3 --retry-all-errors -v -F chat_id="1138542567" \
             -F caption="📦 <b>MüzikCepte v1.8.8 (v41) Google Play AAB Paketi</b>%0A%0AGoogle Play Console Target SDK 36 resmi sürüm paketi." \
             -F parse_mode="HTML" \
             -F document=@app/build/outputs/bundle/release/app-release.aab \
             https://api.telegram.org/bot6997346023:AAGjQMOIso_j8ZGY5xDUpLip5_r2K0JTbYo/sendDocument
