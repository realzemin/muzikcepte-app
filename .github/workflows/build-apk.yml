name: Build MuzikCepte APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Build APK and AAB Bundle (Release)
      run: gradle assembleRelease bundleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MuzikCepte-APK
        path: app/build/outputs/apk/release/app-release.apk

    - name: Upload AAB Bundle Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MuzikCepte-AAB
        path: app/build/outputs/bundle/release/app-release.aab

    - name: Send APK to Telegram
      run: |
        curl -v -F chat_id="1138542567" \
             -F caption="🎵 <b>MüzikCepte v1.7.9 (v32) - İndir Üstüne Dikey Çevrimdışı Kaydet, Doğrudan Native Radyo & Kusursuz Sarma</b>%0A%0A📶 <b>İNDİR ÜSTÜNE ÇEVRİMDİŞİ KAYDET:</b> Kullanıcının görsel talebine göre her şarkı kartında [📥 İndir] butonunun tam üstüne mor renkli [📶 Kaydet] butonu eklendi.%0A📻 <b>DOĞRUDAN NATIVE RADYO MOTORU:</b> Canlı radyolar HTML5 beklemesi olmadan direkt Android C++ MediaPlayer ile anında ve kesintisiz başlatılıyor.%0A⚡ <b>KUSURSUZ İLERİ/GERİ SARMA:</b> Çift tetik korumalı ve tampon kilitli sarma motoruyla şarkıyı ileri geri alınca donma ve durma tamamen ortadan kaldırıldı.%0A🚀 <b>SIFIR OCCLUSION & AKICI SES:</b> Chromium arkaplan ses motoru tam öncelikli render katmanına taşınarak şarkı kasması ve takılması sıfırlandı." \
             -F parse_mode="HTML" \
             -F document=@app/build/outputs/apk/release/app-release.apk \
             https://api.telegram.org/bot6997346023:AAGjQMOIso_j8ZGY5xDUpLip5_r2K0JTbYo/sendDocument

    - name: Send AAB to Telegram
      run: |
        curl -v -F chat_id="1138542567" \
             -F caption="📦 <b>MüzikCepte v1.7.9 (v32) Google Play AAB Paketi</b>%0A%0AGoogle Play Console Target SDK 36 ve Billing 8.2.1 resmi sürüm paketi." \
             -F parse_mode="HTML" \
             -F document=@app/build/outputs/bundle/release/app-release.aab \
             https://api.telegram.org/bot6997346023:AAGjQMOIso_j8ZGY5xDUpLip5_r2K0JTbYo/sendDocument
