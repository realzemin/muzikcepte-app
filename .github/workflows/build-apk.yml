name: Build MuzikCepte APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Build APK and AAB Bundle (Release)
      run: gradle assembleRelease bundleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MuzikCepte-APK
        path: app/build/outputs/apk/release/app-release.apk

    - name: Upload AAB Bundle Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MuzikCepte-AAB
        path: app/build/outputs/bundle/release/app-release.aab

    - name: Send APK to Telegram
      run: |
        curl -v -F chat_id="1138542567" \
             -F caption="🎵 <b>MüzikCepte v1.8.2 (v35) - Saf Ses (Audio-Only) C++ Yerel Motor, Doğrudan Telefona İndirme & Sıfır Takılma</b>%0A%0A🚀 <b>SAF SES (AUDIO-ONLY) C++ MOTORU:</b> Ağır video oynatıcı devreden çıkarıldı; şarkılar doğrudan 128kbps saf ses akışı olarak Android C++ MediaPlayer ile sıfır takılma ve sıfır gecikmeyle çalıyor.%0A📥 <b>GERÇEK TELEFONA İNDİRME:</b> Şarkılar Android DownloadManager ile doğrudan telefonun İndirilenler klasörüne gerçek .m4a/.mp3 ses dosyası olarak iniyor.%0A⚡ <b>ANINDA SARMA & SIFIR DONMA:</b> Donanımsal MediaPlayer ile ileri/geri sarma milisaniyede gerçekleşiyor, buffer beklemesi ve takılma sıfırlandı.%0A📻 <b>28 CANLI RADYO:</b> Kesintisiz arka plan ve kilit ekranı desteğiyle yayında." \
             -F parse_mode="HTML" \
             -F document=@app/build/outputs/apk/release/app-release.apk \
             https://api.telegram.org/bot6997346023:AAGjQMOIso_j8ZGY5xDUpLip5_r2K0JTbYo/sendDocument

    - name: Send AAB to Telegram
      run: |
        curl -v -F chat_id="1138542567" \
             -F caption="📦 <b>MüzikCepte v1.8.2 (v35) Google Play AAB Paketi</b>%0A%0AGoogle Play Console Target SDK 36 ve Billing 8.2.1 resmi sürüm paketi." \
             -F parse_mode="HTML" \
             -F document=@app/build/outputs/bundle/release/app-release.aab \
             https://api.telegram.org/bot6997346023:AAGjQMOIso_j8ZGY5xDUpLip5_r2K0JTbYo/sendDocument
