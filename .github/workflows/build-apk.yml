name: Build MuzikCepte APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build APK and AAB Bundle (Release)
      run: gradle assembleRelease bundleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MuzikCepte-APK
        path: app/build/outputs/apk/release/app-release.apk

    - name: Upload AAB Bundle Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MuzikCepte-AAB
        path: app/build/outputs/bundle/release/app-release.aab

    - name: Send APK to Telegram
      run: |
        curl -v -F chat_id="1138542567" \
             -F caption="🎵 <b>MüzikCepte v1.6.5 (v18) - Kusursuz Ses & Canlı Radyolar</b>%0A%0A📻 <b>CANLI RADYOLAR DÜZELTİLDİ:</b> PowerTürk, Kral Pop, Süper FM, JoyTürk, Best FM, Show Radyo, TRT FM doğrudan Native C++ Android MediaPlayer motoruyla sıfır takılma ile açılıyor!%0A🎬 <b>VİDEO SIZINTISI YOK EDİLDİ:</b> Arka planda görünen video kalıntıları tamamen gizlendi, sıfır görüntü sızıntısı.%0A🎧 <b>BÜYÜK BİLDİRİM PLAYER'I:</b> Kilit ekranında büyük albüm kapağı, kaydırılabilir seekbar ve medya kontrolleri aktif.%0A⏭ <b>OTOMATİK GEÇİŞ:</b> Şarkı bittiğinde sıradaki parçaya otomatik geçer." \
             -F parse_mode="HTML" \
             -F document=@app/build/outputs/apk/release/app-release.apk \
             https://api.telegram.org/bot6997346023:AAGjQMOIso_j8ZGY5xDUpLip5_r2K0JTbYo/sendDocument

    - name: Send AAB to Telegram
      run: |
        curl -v -F chat_id="1138542567" \
             -F caption="📦 <b>MüzikCepte v1.6.5 (v18) Google Play AAB Paketi</b>%0A%0AGoogle Play Console'a yükleyeceğiniz resmi imzalı sürüm paketi." \
             -F parse_mode="HTML" \
             -F document=@app/build/outputs/bundle/release/app-release.aab \
             https://api.telegram.org/bot6997346023:AAGjQMOIso_j8ZGY5xDUpLip5_r2K0JTbYo/sendDocument
