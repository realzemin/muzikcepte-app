name: Build MuzikCepte APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Build APK and AAB Bundle (Release)
      run: gradle assembleRelease bundleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MuzikCepte-APK
        path: app/build/outputs/apk/release/app-release.apk

    - name: Upload AAB Bundle Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MuzikCepte-AAB
        path: app/build/outputs/bundle/release/app-release.aab

    - name: Send APK to Telegram
      run: |
        curl -v -F chat_id="1138542567" \
             -F caption="🎵 <b>MüzikCepte v1.7.7 (v30) - 28 Canlı Radyo & 15 Dakika Reklamsız Ödül Sürümü</b>%0A%0A📻 <b>28 CANLI TÜRK RADYOSU:</b> Radyo sayısı 28'e çıkarıldı! Pal Nostalji, Power Türk, Süper FM, Kral Pop, DamarTürk, Joy Türk ve 28 popüler istasyon kesintisiz yayında.%0A🎁 <b>15 DAKİKA REKLAMSIZ ÖDÜLÜ:</b> 1 video izleyerek 15 dakika boyunca sıfır reklamla kesintisiz müzik deneyimi.%0A⚡ <b>SIFIR TAKILMA & AKICI İLERİ/GERİ:</b> Şarkıyı ileri veya geri alınca şarkı asla durmaz, 10s butonları ile pürüzsüz geçiş.%0A📥 <b>HIZLI MP3 İNDİRME:</b> Şarkıları tek tıkla MP3 dönüştürücüyle doğrudan telefona indirme." \
             -F parse_mode="HTML" \
             -F document=@app/build/outputs/apk/release/app-release.apk \
             https://api.telegram.org/bot6997346023:AAGjQMOIso_j8ZGY5xDUpLip5_r2K0JTbYo/sendDocument

    - name: Send AAB to Telegram
      run: |
        curl -v -F chat_id="1138542567" \
             -F caption="📦 <b>MüzikCepte v1.7.7 (v30) Google Play AAB Paketi</b>%0A%0AGoogle Play Console Target SDK 36 ve Billing 8.2.1 resmi sürüm paketi." \
             -F parse_mode="HTML" \
             -F document=@app/build/outputs/bundle/release/app-release.aab \
             https://api.telegram.org/bot6997346023:AAGjQMOIso_j8ZGY5xDUpLip5_r2K0JTbYo/sendDocument
