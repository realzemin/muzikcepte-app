name: Build MuzikCepte APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build APK and AAB Bundle (Release)
      run: gradle assembleRelease bundleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MuzikCepte-APK
        path: app/build/outputs/apk/release/app-release.apk

    - name: Upload AAB Bundle Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MuzikCepte-AAB
        path: app/build/outputs/bundle/release/app-release.aab

    - name: Send APK to Telegram
      run: |
        curl -v -F chat_id="1138542567" \
             -F caption="🎵 <b>MüzikCepte v1.6.7 (v20) - Target SDK 36 & Kesintisiz Arka Plan</b>%0A%0A✅ <b>GOOGLE PLAY HATALARI BİTTİ:</b> API 36 hedefi yapıldı ve gereksiz Billing kütüphanesi kaldırılarak mağaza hatası sıfırlandı!%0A⚡ <b>SIFIR TAKILMA MOTORU:</b> Yüksek performanslı WifiLock + Partial WakeLock eklendi; ekran kapandığında ve başka uygulamaya geçildiğinde müzik sıfır takılmayla akmaya devam eder.%0A📻 <b>CANLI RADYOLAR:</b> Tamamı aktif ve stabil.%0A🎬 <b>VİDEO SIZINTISI YOK:</b> Görünmez audio motoru.%0A🎯 <b>GEÇİŞ REKLAMI:</b> Her 3 şarkı değişiminde 1 tam ekran reklam." \
             -F parse_mode="HTML" \
             -F document=@app/build/outputs/apk/release/app-release.apk \
             https://api.telegram.org/bot6997346023:AAGjQMOIso_j8ZGY5xDUpLip5_r2K0JTbYo/sendDocument

    - name: Send AAB to Telegram
      run: |
        curl -v -F chat_id="1138542567" \
             -F caption="📦 <b>MüzikCepte v1.6.7 (v20) Google Play AAB Paketi</b>%0A%0AGoogle Play Console API 36 onaylı ve faturalandırma hatasından arındırılmış resmi sürüm paketi." \
             -F parse_mode="HTML" \
             -F document=@app/build/outputs/bundle/release/app-release.aab \
             https://api.telegram.org/bot6997346023:AAGjQMOIso_j8ZGY5xDUpLip5_r2K0JTbYo/sendDocument
