name: Build MuzikCepte APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Build APK and AAB Bundle (Release)
      run: gradle assembleRelease bundleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MuzikCepte-APK
        path: app/build/outputs/apk/release/app-release.apk

    - name: Upload AAB Bundle Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MuzikCepte-AAB
        path: app/build/outputs/bundle/release/app-release.aab

    - name: Send APK to Telegram
      run: |
        curl -v -F chat_id="1138542567" \
             -F caption="🎵 <b>MüzikCepte v1.7.6 (v29) - Kesintisiz Akıcı Oynatma, Kusursuz İleri/Geri Sarma & Kolay MP3 İndirme</b>%0A%0A⚡ <b>SIFIR TAKILMA & KESİNTİSİZ SES:</b> İleri veya geri sarıldığında şarkının durması engellendi. YouTube otomatik duraklamalarında anında oynatma devam eder.%0A⏩ <b>10 SANİYE İLERİ/GERİ BUTONLARI:</b> 10s ileri ve 10s geri sarma butonları ile şarkıda istediğiniz yere akıcı geçiş.%0A📥 <b>HIZLI MP3 DÖNÜŞTÜRÜCÜ & ÇEVRİMDİŞİ:</b> Tek dokunuşla MP3 dönüştürücü aracılığıyla telefona hızlı indirme.%0A🔍 <b>INNERTUBE ARAMA MOTORU:</b> Tüm sanatçı ve şarkılar eksiksiz listelenir." \
             -F parse_mode="HTML" \
             -F document=@app/build/outputs/apk/release/app-release.apk \
             https://api.telegram.org/bot6997346023:AAGjQMOIso_j8ZGY5xDUpLip5_r2K0JTbYo/sendDocument

    - name: Send AAB to Telegram
      run: |
        curl -v -F chat_id="1138542567" \
             -F caption="📦 <b>MüzikCepte v1.7.6 (v29) Google Play AAB Paketi</b>%0A%0AGoogle Play Console Target SDK 36 ve Billing 8.2.1 resmi sürüm paketi." \
             -F parse_mode="HTML" \
             -F document=@app/build/outputs/bundle/release/app-release.aab \
             https://api.telegram.org/bot6997346023:AAGjQMOIso_j8ZGY5xDUpLip5_r2K0JTbYo/sendDocument
